<script>
'use strict';

/* ───────── 공통 유틸: Toast + 에러 처리 ───────── */
function showToast(msg) {
  var wrap = document.getElementById('toastWrap');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function () { el.remove(); }, 3200);
}
window.onerror = function (msg) {
  showToast('오류가 발생했습니다: ' + msg);
  console.error(msg);
  return false;
};
window.addEventListener('unhandledrejection', function (e) {
  showToast('오류가 발생했습니다.');
  console.error(e.reason);
});

/* ───────── 좌표 계산 (Haversine, 지구 반경 6371km) ───────── */
var EARTH_R_KM = 6371.0;
function toRad(d) { return (d * Math.PI) / 180; }
function toDeg(r) { return (r * 180) / Math.PI; }

function haversineKm(lat1, lon1, lat2, lon2) {
  var phi1 = toRad(lat1), phi2 = toRad(lat2);
  var dPhi = toRad(lat2 - lat1), dLambda = toRad(lon2 - lon1);
  var a = Math.sin(dPhi / 2) * Math.sin(dPhi / 2) +
    Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) * Math.sin(dLambda / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return EARTH_R_KM * c;
}

function destinationPoint(lat1, lon1, bearingDeg, distKm) {
  var dR = distKm / EARTH_R_KM;
  var brng = toRad(bearingDeg);
  var lat1r = toRad(lat1), lon1r = toRad(lon1);
  var lat2 = Math.asin(Math.sin(lat1r) * Math.cos(dR) + Math.cos(lat1r) * Math.sin(dR) * Math.cos(brng));
  var lon2 = lon1r + Math.atan2(
    Math.sin(brng) * Math.sin(dR) * Math.cos(lat1r),
    Math.cos(dR) - Math.sin(lat1r) * Math.sin(lat2)
  );
  return { lat: toDeg(lat2), lon: toDeg(lon2) };
}

/* ───────── 결정적 시드 난수 (mulberry32) ───────── */
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);

/* ───────── 중심 좌표 & 목업 업체 42개 생성 ───────── */
var CENTER = { lat: 35.16418, lon: 129.11351 }; // 부산 수영구 남천동로 100 부근

var CATS = [

// 업종별 이름 접두어는 지역명이 아닌 일반 명칭만 사용하고, GPS로 감지된 지역명(areaShort)을 앞에 붙여

var NAME_PARTS = {

STORES = buildStores(CENTER, '부산광역시 수영구');

/* ─────────────────────────────────────────────────────────────

   (공공데이터포털 data.go.kr, 데이터셋 15012005) - 반경 내 상가업소 조회
   엔드포인트: GET https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius
   파라미터  : serviceKey, cx(경도), cy(위도), radius(m, 이 API 자체 상한 1000m),
              type=json, numOfRows, pageNo
   응답 예   : { header:{resultCode,resultMsg}, body:{items:[{bizesNm, indsLclsNm,
              indsMclsNm, rdnmAdr, lnoAdr, lon, lat, ...}], totalCount, ...} }
   ※ 이 데이터셋은 전화번호를 제공하지 않음(개인정보 비공개) → phone은 빈 값 처리.
   ※ 공공데이터포털에서 무료로 발급받은 "일반 인증키(Decoding)"를 아래에 넣으면
      실제 데이터로 자동 전환되고, 키가 없거나 호출 실패 시 목업 데이터로 대체된다.

var SANGGA_CFG = {
  enabled: true,
  serviceKey: 'YOUR_DATA_GO_KR_DECODING_SERVICE_KEY', // TODO: data.go.kr에서 무료 발급받은 키로 교체
  baseUrl: 'https://apis.data.go.kr/B553077/api/open/sdsc2/storeListInRadius',
  maxRadiusM: 1000, // 반경조회 API 자체 상한(공식 가이드 기준). 이보다 넓은 반경은 다건 조회로 커버 예정.
  numOfRows: 500

SANGGA_CFG.proxy = 'https://smartc.co.kr/api/stores';   /* 공공데이터포털 상가정보를 smartc.co.kr 서버가 대신 불러준다 */ var usingRealSangga = false;

function mapIndsToCat(lclsNm, mclsNm) {
  var s = (lclsNm || '') + ' ' + (mclsNm || '');
  if (/음식|한식|중식|일식|양식|분식|주점|호프|치킨/.test(s)) return { key: 'food', icon: '🍚' };
  if (/카페|커피|제과|베이커리/.test(s)) return { key: 'cafe', icon: '☕' };
  if (/편의점|슈퍼|마트/.test(s)) return { key: 'conv', icon: '🏪' };
  if (/약국|약제/.test(s)) return { key: 'pharm', icon: '💊' };
  if (/의원|병원|치과|한의원/.test(s)) return { key: 'hosp', icon: '🏥' };

/* 공공데이터포털 상가정보 API에서 반경 내 실제 업체 목록을 가져온다. 실패 시 예외를 던진다. */
function fetchRealStores(centerPt, radiusKm) { if (SANGGA_CFG.proxy) { var rM = Math.round(Math.min(Math.max(radiusKm, 0.1) * 1000, 5000)), tries = 0; var get = function () { tries += 1; return fetch(SANGGA_CFG.proxy + '?lat=' + centerPt.lat.toFixed(5) + '&lon=' + centerPt.lon.toFixed(5) + '&r=' + rM + (tries > 1 ? '&t=' + tries : '')).then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); }).then(function (j) { if (j && j.partial && tries < 5) { return new Promise(function (ok) { setTimeout(ok, 1200); }).then(get); } return j; }); }; return get().then(function (j) { window.__storesKm = rM / 1000; var items = (j && j.items) || []; if (!items.length) throw new Error('결과 없음'); return items.map(function (it, i) { var cat = mapIndsToCat(it.s + ' ' + it.m, it.l === '음식' ? '' : it.l); return { id: it.id || ('real-' + i), name: it.name || '(상호명 미상)', category: cat.key, icon: cat.icon, lat: it.lat, lon: it.lon, phone: '', addr: it.addr || '' }; }); }); }   /* 스마트시 서버 중계(인증키는 서버에만 보관) */
  var radiusM = Math.min(Math.max(radiusKm, 0.05) * 1000, SANGGA_CFG.maxRadiusM);

    '?serviceKey=' + encodeURIComponent(SANGGA_CFG.serviceKey) +
    '&cx=' + centerPt.lon + '&cy=' + centerPt.lat +

/* 실데이터 연동을 시도하고, 키 미설정/호출 실패/CORS 차단 시 목업으로 자동 대체한다. */
function refreshStores(centerPt, areaLabel, radiusKmForFetch) {
  if (!SANGGA_CFG.enabled || (!SANGGA_CFG.proxy && SANGGA_CFG.serviceKey === 'YOUR_DATA_GO_KR_DECODING_SERVICE_KEY')) {
    usingRealSangga = false;

    return Promise.resolve();
  }
  var mySeq = (window.__storesSeq = (window.__storesSeq || 0) + 1);   /* 늦게 도착한 이전 위치 결과가 새 위치 결과를 덮지 않게 */
  return fetchRealStores(centerPt, radiusKmForFetch || 5).then(function (real) {
    if (mySeq !== window.__storesSeq) return;
    STORES = real;
    usingRealSangga = true;
    showToast('무료 공공 상가정보(소상공인시장진흥공단) ' + real.length + '건을 불러왔습니다.');
    updateDataSourceBadge();
  }).catch(function (err) {
    console.error(err);
    if (mySeq !== window.__storesSeq) return;
    STORES = buildStores(centerPt, areaLabel);
    usingRealSangga = false;
    showToast('공공 상가정보 API 호출 실패 → 목업 데이터로 대체합니다. (서비스키/CORS 확인 필요)');

function updateDataSourceBadge() {

/* ───────── 실제 온라인 지도 (Leaflet + OpenStreetMap 타일) ─────────

   오프라인이거나 타일 로드에 실패하면 자동으로 대체(연한 배경) 처리한다. */
var leafletMaps = {}; // { canvasId: { map, centerMarker, circle, poiMarkers:[] } }

function ensureLeafletMap(containerId) {

  var el = document.getElementById(containerId);
  if (!el) return null;

    zoomControl: false,

    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, FAO, NOAA, USGS'
  });

  var tileErrorCount = 0;
  var switchedToFallback = false;

      fallbackTiles.addTo(map);

/* radiusKm(가시반경) 원을 그리고, stores 배열을 마커로 표시한다. stores가 null이면 마커 없이 중심/원만 갱신 */
function drawMap(containerId, radiusKm, stores) {

  if (!rec) { return; } // Leaflet 미로드(완전 오프라인) — 지도 없이 나머지 기능은 계속 동작

  rec.map.setView([CENTER.lat, CENTER.lon], stores ? 14 : 15);
  rec.centerMarker.setLatLng([CENTER.lat, CENTER.lon]);
  rec.circle.setLatLng([CENTER.lat, CENTER.lon]);
  var radiusKmSafe = Math.max(radiusKm, 0.05);
  rec.circle.setRadius(radiusKmSafe * 1000);

  var edgePt = destinationPoint(CENTER.lat, CENTER.lon, 90, radiusKmSafe);
  rec.circleLabel.setLatLng([edgePt.lat, edgePt.lon]);

/* ───────── 필터/정렬 ───────── */
function filterAndSort(radiusKm, category, keyword) {
  var out = [];
  for (var i = 0; i < STORES.length; i += 1) {
    var s = STORES[i];
    if (category !== 'all' && s.category !== category) continue;
    if (keyword && s.name.indexOf(keyword) === -1) continue;
    var d = haversineKm(CENTER.lat, CENTER.lon, s.lat, s.lon);
    if (d <= radiusKm) out.push({ store: s, distKm: d });
  }
  out.sort(function (a, b) { return a.distKm - b.distKm; });
  return out;
}

/* ───────── 상태 ───────── */
var state = { radiusKm: 1, category: '', keyword: '' };   /* 업종을 누르기 전에는 목록을 보이지 않음 */

      return function () { state.radiusKm = km; renderRadiusChips(); renderResults(); if (SANGGA_CFG.proxy && km > (window.__storesKm || 1)) { showToast('반경 ' + km + 'km 업체를 불러오는 중…'); refreshStores(CENTER, (currentDistrict && currentDistrict.name) || '', km).then(function () { renderResults(); }); } };   /* 넓은 반경은 눌렀을 때 서버에서 더 불러온다 */
    }(o.km));

  }
}

function renderCatChips() {

  wrap.innerHTML = '';

function renderResults() {
  if (!state.category && !state.keyword) { document.getElementById('resultCount').textContent = '위에서 업종을 눌러 주세요'; document.getElementById('storeList').innerHTML = '<div class="empty">음식점·카페·편의점·약국·병원·주차장 등 업종 버튼을 누르면 내 주변 업체가 나옵니다.</div>'; return; }
  var results = filterAndSort(state.radiusKm, state.category || 'all', state.keyword);
  document.getElementById('resultCount').textContent =
    '반경 ' + (state.radiusKm < 1 ? state.radiusKm * 1000 + 'm' : state.radiusKm + 'km') + ' 안 ' + results.length + '건';
  var list = document.getElementById('storeList');
  list.innerHTML = '';
  if (results.length === 0) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '조건에 맞는 업체가 없습니다.';
    list.appendChild(empty);
  } else {
    for (var r of results) {

var randGov = mulberry32(719);
function buildGovList(count, namePool, iconPool, descPool) {
  var out = [];
  for (var i = 0; i < count; i += 1) {
    var bearing = randGov() * 360;
    var distKm = 0.1 + randGov() * 2.4;
    var pt = destinationPoint(CENTER.lat, CENTER.lon, bearing, distKm);
    out.push({
      name: namePool[i % namePool.length] + (i >= namePool.length ? ' ' + (Math.floor(i / namePool.length) + 1) + '호' : ''),
      icon: iconPool[i % iconPool.length],
      desc: descPool[i % descPool.length],
      lat: pt.lat, lon: pt.lon
    });
  }
  var d = CENTER;
  for (var j = 0; j < out.length; j += 1) {
    out[j].distKm = haversineKm(d.lat, d.lon, out[j].lat, out[j].lon);
  }
  out.sort(function (a, b) { return a.distKm - b.distKm; });
  return out;
}

function nearestLandmark(lat, lon, districtShort) {
  var list = LANDMARKS[districtShort];
  if (!list || list.length === 0) return null;
  var best = list[0];
  var bestKm = haversineKm(lat, lon, best.lat, best.lon);
  for (var i = 1; i < list.length; i += 1) {
    var p = list[i];
    var km = haversineKm(lat, lon, p.lat, p.lon);
    if (km < bestKm) { bestKm = km; best = p; }
  }
  return { landmark: best, distKm: bestKm };
}

  if (kind === 'safety') renderGovList(currentDistrict.short + ' 안전지도', SHELTERS);
  else if (kind === 'tour') renderGovList(currentDistrict.short + ' 관광정보', TOURSPOTS);
  else if (kind === 'restroom') renderGovList(currentDistrict.short + ' 공중화장실', RESTROOMS);
  else if (kind === 'parking') renderGovList(currentDistrict.short + ' 주차장', PARKINGS);
  else if (kind === 'civil') renderCivilForm();
}

/* ───────── GPS 활성화: 실제 기기 위치 기반으로 전환 ───────── */
var gpsActive = false;
function setGpsStatus(text) {
  document.getElementById('gpsStatus').textContent = text;
}
function walkMinutes(km) { return Math.max(1, Math.round(km * 1000 / 67)); }

function onGpsSuccess(pos) {
  var lat = pos.coords.latitude;
  var lon = pos.coords.longitude;
  var acc = Math.round(pos.coords.accuracy || 0);

  CENTER = { lat: lat, lon: lon };
  var nd = nearestDistrict(lat, lon);
  currentDistrict = nd.district;
  applyDistrict(currentDistrict);

  var nl = nearestLandmark(lat, lon, currentDistrict.short);
  var landmarkText = nl
    ? nl.landmark.icon + ' ' + nl.landmark.name + ' 인근(도보 약 ' + walkMinutes(nl.distKm) + '분)'
    : '';

  var addrEl = document.getElementById('addrText');
  addrEl.innerHTML = '<span class="city">' + currentDistrict.name + ' 인근</span>' +
    (landmarkText ? landmarkText + ' · ' : '') + 'GPS 실시간 위치 (오차 ±' + acc + 'm)';
  applyAddrLabel(currentDistrict.name + (nl ? ' ' + nl.landmark.name + ' 인근' : '') +
    ' GPS 실시간 위치(위도 ' + lat.toFixed(5) + ', 경도 ' + lon.toFixed(5) + ')');

  drawMap('mapCanvas', 1, null);
  gpsActive = true;
  setGpsStatus('최근접 지자체: ' + currentDistrict.short + ' (약 ' + distLabelOf(nd.distKm) + ')');
  showToast('GPS 위치를 확인했습니다 → ' + currentDistrict.name + ' 데이터로 전환');

  refreshStores(CENTER, currentDistrict.name, state.radiusKm).then(function () {
    if (document.getElementById('panel-nearby').classList.contains('active')) renderResults();
  });
}

function gpsErrorReason(err) {
  if (err && err.code === 1) return 'GPS 권한이 거부되었습니다. 브라우저 주소창 옆 위치 권한을 허용해 주세요.';
  if (err && err.code === 2) return '위치 정보를 사용할 수 없습니다. 실내/네트워크 상태를 확인해 주세요.';
  if (err && err.code === 3) return '위치 확인 시간이 초과되었습니다.';
  return '위치 확인에 실패했습니다.';
}

function requestGps(silent) {
  if (!('geolocation' in navigator)) {
    if (!silent) showToast('이 브라우저/환경은 GPS(위치 정보)를 지원하지 않습니다.');
    setGpsStatus('미지원 환경');
    return;
  }
  if (!window.isSecureContext) {
    if (!silent) showToast('HTTPS(보안 연결)가 아니면 위치 정보를 사용할 수 없습니다.');
    setGpsStatus('비보안 연결(HTTP)');
    return;
  }
  setGpsStatus('GPS 신호 대기 중... (최대 12초)');

  navigator.geolocation.getCurrentPosition(
    function (pos) { onGpsSuccess(pos); },
    function (err1) {
      // 1차(고정밀 GPS) 실패/시간초과 시 → 2차: Wi-Fi/기지국 기반 저정밀 위치로 자동 재시도
      console.error('GPS 1차 실패:', err1);
      setGpsStatus('GPS 신호가 약해 네트워크 기반 위치로 재시도합니다...');
      navigator.geolocation.getCurrentPosition(
        function (pos) { onGpsSuccess(pos); },
        function (err2) {
          if (!silent) showToast(gpsErrorReason(err2));
          setGpsStatus('');
          console.error('GPS 2차 실패:', err2);
        },
        { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
      );
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

  var v = document.getElementById('actVoice'); if (v) v.addEventListener('click', function () { document.getElementById('ttsBtn').click(); });
  var c = document.getElementById('actCopy'); if (c) c.addEventListener('click', function () {
    var a = actAddr(), done = function () { showToast('주소를 복사했습니다'); };
    var fb = function () { try { var t = document.createElement('textarea'); t.value = a; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); } catch (e) { console.error('복사 실패', e); showToast('복사하지 못했습니다'); } };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(a).then(done, fb); else fb();
  });
  var r = document.getElementById('actRoute'); if (r) r.addEventListener('click', function (ev) {   /* 휴대폰에 네이버지도 앱이 있으면 앱으로, 없으면 웹 길찾기 */
    actRefresh();
    if (!/Android|iPhone|iPad/i.test(navigator.userAgent)) return;
    ev.preventDefault();
    var web = r.getAttribute('href'), left = false;
    var onHide = function () { left = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    location.href = 'nmap://route/walk?dlat=' + CENTER.lat.toFixed(6) + '&dlng=' + CENTER.lon.toFixed(6) + '&dname=' + encodeURIComponent(actAddr()) + '&appname=smartc.co.kr';
    setTimeout(function () { if (!left && !document.hidden) location.href = web; }, 1500);
  });
  actRefresh();
})();
/* ───────── 초기 렌더 ───────── */
drawMap('mapCanvas', 1, null);
renderRadiusChips();
renderCatChips();
updateDataSourceBadge();
refreshStores(CENTER, '부산광역시 수영구', state.radiusKm).then(function () {
  if (document.getElementById('panel-nearby').classList.contains('active')) renderResults();
});
/* 앱 진입 시 자동으로 GPS 내 위치로 전환 시도 (권한 거부/실패 시 조용히 기본 주소 유지) */
if (QR.on) { qrInit(); qrAutoGps(); } else requestGps(true);   /* QR로 들어오면 주소판 위치 기준, 아니면 내 GPS 위치 */

/* PWA: 서비스워커 등록(오프라인 캐싱 + 홈 화면 설치 지원) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.error('서비스워커 등록 실패:', err);
    });
  });
}
</script>
